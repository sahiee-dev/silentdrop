[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silentdrop"
version = "0.3.0"
description = "Behavioral drift detection for LLM agents: catch domain-conditioned suppression of verification actions and unverified confident answers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sahir" }]
keywords = ["llm", "agents", "security", "backdoor-detection", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
silentdrop = "silentdrop.cli:main"

[tool.setuptools.packages.find]
include = ["silentdrop*"]
